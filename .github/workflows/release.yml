name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Verify release commit is on main
        run: git fetch origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: uv run ruff format --check src tests examples scripts
      - run: uv run ruff check src tests examples scripts
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run mkdocs build --strict
      - run: uv build --clear
      - run: uv run python scripts/check_wheel.py dist/*.whl
      - run: uv venv --clear .package-venv
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/python -c "from syntiq_mt5 import MT5, SyntiqMT5; assert MT5 is SyntiqMT5"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/syntiq-mt5
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

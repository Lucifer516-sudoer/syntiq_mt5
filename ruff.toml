line-length = 88
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (logic issues)
    "W",   # warnings
    "I",   # import sorting
    "UP",  # modern Python (pyupgrade)
    "B",   # bugbear (real mistakes)
    "C4",  # comprehensions
    "SIM", # simplifications
    "RET", # return issues
    "PTH", # pathlib over os
    "RUF"  # ruff-specific rules
]

ignore = [
    "E501",  # handled by line-length
    "RUF002",  # prose may use typographic punctuation
    "RUF003",  # comments may use typographic punctuation
    "UP046",  # Pydantic generic models still use Generic[T]
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow re-exports
"tests/**/*.py" = ["ARG", "B011", "C408", "S101"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

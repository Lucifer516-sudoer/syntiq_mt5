site_name: Syntiq MT5
site_description: A typed, testable Python interface for MetaTrader 5
site_url: https://lucifer516-sudoer.github.io/syntiq_mt5/
repo_url: https://github.com/Lucifer516-sudoer/syntiq_mt5
repo_name: Lucifer516-sudoer/syntiq_mt5
copyright: Copyright &copy; 2026 Lucifer516-sudoer

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Manrope
    code: JetBrains Mono
  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.path
    # Search
    - search.highlight
    - search.suggest
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.tooltips
    # TOC
    - toc.follow

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - mkdocstrings:
      handlers:
        python:
          import:
            - https://docs.python.org/3/objects.inv
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: spacy
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            heading_level: 2
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_if_no_docstring: false
            filters:
              - "!^_"  # Exclude private members by default
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  # Admonitions
  - admonition
  - pymdownx.details
  # Code
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Tabs
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  # Formatting
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  # Emoji
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Layout
  - tables
  - attr_list
  - md_in_html
  - def_list
  # Footnotes & abbreviations
  - footnotes
  - abbr
  - pymdownx.snippets
  # TOC
  - toc:
      permalink: true
      title: On this page

extra_css:
  - assets/custom.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lucifer516-sudoer/syntiq_mt5
      name: syntiq-mt5 on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/syntiq-mt5/
      name: syntiq-mt5 on PyPI

nav:
  - Home: index.md
  - Get Started: quickstart.md
  - Core Design: concepts.md
  - Guides:
      - Market Data: market-data.md
      - Trading Safely: trading.md
  - Reference:
      - Public API: api-session.md
  - Development:
      - Contributing: development.md
      - Releasing To PyPI: releasing.md
